<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay｜配送ダッシュボード</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><header><div class="top wrap"><div class="brand"><svg viewBox="0 0 36 34" aria-hidden="true"><path fill="#2c56ef" d="M10 2h12L12 17H0zm15 0h10L15 32H5zm1 18 9 12H21l-2-3z"/></svg>Relay</div><span class="console">Logistics Console</span><div class="account"><span class="status">システム正常</span><span class="avatar" aria-label="デモの利用者 RK">RK</span></div></div></header>
<main class="wrap"><section class="hero"><div class="hero-copy"><div class="eyebrow"><i></i> OPERATIONS OVERVIEW</div><h1>配送ダッシュボード</h1><p>配送ネットワークの稼働状況を、ひと目で。</p><span class="snapshot">● &nbsp; DEMO WORKSPACE</span></div><img class="network" src="network.svg" alt=""></section>
<div class="toolbar"><div class="period" role="group" aria-label="集計期間"><button data-period="day">日次</button><button data-period="week" aria-pressed="true">週次</button><button data-period="month">月次</button></div><div class="tools"><span id="dates"></span><label class="branch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><select id="branch" aria-label="集計拠点"><option value="0">すべての拠点</option><option value="1">東湾ハブ</option><option value="2">中央ハブ</option><option value="3">西丘ハブ</option></select></label></div></div>
<section id="metrics" aria-label="主要指標"></section><div class="analysis"><section class="panel"><div class="panel-head"><div><small>DELIVERY VOLUME</small><h2>配送件数の推移</h2></div><div class="legend"><span><i></i>今期</span><span><i></i>前期</span></div></div><svg id="trend" viewBox="0 0 660 206" role="img" aria-label="今期と前期の配送件数の推移"></svg></section><section class="panel"><div class="panel-head"><div><small>SHIPMENT STATUS</small><h2>配送ステータス</h2></div></div><div class="breakdown"><div class="ring"><svg id="donut" viewBox="0 0 140 140" aria-hidden="true"></svg><div><small>合計件数</small><b id="ring-total"></b></div></div><div id="statuses"></div></div></section></div>
<section class="panel depots"><small>HUB PERFORMANCE</small><h2>拠点別の配送実績</h2><table><thead><tr><th>配送拠点</th><th>配送件数</th><th>定時配送率</th><th>稼働車両</th></tr></thead><tbody id="rows"></tbody></table></section><footer>Relay Logistics Console <span>架空の配送サービスを想定したデモです。表示データはすべて架空です。</span></footer></main></body></html>
