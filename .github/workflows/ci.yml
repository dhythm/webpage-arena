name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "4310"
      BASE_URL: http://127.0.0.1:4310
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      # 静的ギャラリーで業務ロジックがないため、Playwright を使うテスト（npm test / test:a11y / test:sites / test:smoke-selftest）は
      # CI で毎回は回さない（2026-11-24 ユーザー指示）。作品追加時や見た目を大きく変えたときに手元で回す。
      # 不具合が出たら、必要な分だけ戻す。
      - run: npm run build
