name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-enabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/${REPO}/pages")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "::notice title=pages::Pages 未有効のためスキップ（Settings → Pages → Source：GitHub Actions で有効化）"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=pages::GET /repos/${REPO}/pages returned ${status}"
              exit 1
              ;;
          esac

  build:
    needs: [pages-enabled]
    if: needs.pages-enabled.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [pages-enabled, build]
    if: needs.pages-enabled.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
